name: Kırık link denetimi
on:
  push:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir ${{ github.workspace }} './**/*.html' 'https://pbcreative.co/'
          fail: true
